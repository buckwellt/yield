:root {
  color-scheme: light;
  --bg: #f3f2ef;
  --surface: #fbfaf8;
  --inset: #e7e5e0;
  --fg: #1a1a19;
  --muted: #5c5b57;
  --border: #ddd9d2;
  --accent: #3e5166;
  --ink: #1c1c1a;
  --ink-fg: #f6f5f2;
  --sans: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
}
button, a, input { font: inherit; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, .display, .word {
  font-family: var(--display);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.15;
  text-wrap: balance;
}
p { text-wrap: pretty; margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.shell {
  width: min(100%, 28rem);
  margin: 0 auto;
  min-height: 100dvh;
}
.page {
  padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(6.25rem + env(safe-area-inset-bottom));
}
.session .page { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
.word { font-size: 1.35rem; margin: 0; }
.display { font-size: 1.85rem; margin: 0.15rem 0 0; }
.h-lg { font-size: 1.2rem; margin: 0; }
.kicker { margin: 0; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
.muted { color: var(--muted); font-size: 0.875rem; }
.accent { color: var(--accent); font-size: 0.875rem; }
.lede { margin-top: 0.5rem; color: var(--muted); }
.fine { margin-top: 0.75rem; color: var(--muted); font-size: 0.875rem; }
.guard { margin-top: 1.5rem; color: var(--muted); font-size: 0.875rem; }
.space { margin-top: 1.5rem; }
.block { margin-top: 2rem; }
.groups { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
.stack { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.card {
  margin-top: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
}
.pad { padding: 1rem 1rem 1.1rem; }
.list { padding: 0.35rem 1rem 0.5rem; }
.row { padding: 0.75rem 0; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; padding-top: 0.65rem; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
.baseline { align-items: baseline; }
.centerline { align-items: center; }
.name { margin-top: 0.15rem; font-weight: 500; }
.note { margin-top: 0.45rem; font-size: 0.875rem; }
.center { text-align: center; }
.nums { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 0.875rem; }
.load { margin-top: 0.8rem; font-size: 1.125rem; }
.dose { font-size: 1.125rem; font-weight: 500; }
.steps { margin-top: 0.75rem; padding-left: 1.2rem; list-style: decimal; font-size: 0.875rem; }
.steps li + li { margin-top: 0.25rem; }
.callout { margin-top: 0.75rem; background: var(--inset); border-radius: 12px; padding: 0.55rem 0.75rem; font-size: 0.875rem; }
.cues { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.45rem; }

        if (!prev) {

  const last = ratings.slice(-3);
  if (last.length === 0) return "No ratings yet";
  const slots = last.map((item) => RATING_LABEL[item.rating]);
  while (slots.length < 3) slots.push("—");
  return slots.join(" · ");
}

function laddersHTML() {
  const nowMs = Date.now();
  const ready = ensure(state, state.createdAt || new Date().toISOString());
  const groups = GROUPS.map((group) => {
    const chains = group.chains
      .map((chain) => {
        const progress = ready.chains[chain.id];
        const gate = gateStatus(progress, nowMs);
        const protocol = protocolLabel(progress.tierIndex);
        const current = chain.rungs[progress.rungIndex];
        const rungs = chain.rungs
          .map((rung, index) => {
            const resolved = resolveLoad(rung.load, ready.gear);
            const here = index === progress.rungIndex;
            return `<li class="${here ? "rung here" : "rung"}">
              <span class="strong">${esc(RUNG_LEVELS[index])}</span>
              · ${esc(rung.name)} · ${esc(resolved.ok ? resolved.line : loadAsk(rung.load))}
              ${resolved.ok ? "" : " · more than you own"}${here ? " · current" : ""}
            </li>`;
          })
          .join("");
        return `<article class="card pad">
          <h3 class="h-lg">${esc(chain.family)}</h3>
          <p>Now · ${esc(current.name)}${protocol ? ` · ${esc(protocol)}` : ""}</p>
          <p class="muted">Last three · ${esc(marks(progress.ratings))}</p>
          <p class="muted">${esc(gate.ok ? "Two of the last three were easy, and the week on this step is in." : gate.reason)}</p>
          <p class="climb">${esc(nextClimbText(chain, progress, ready.gear))}</p>
          <ol class="rungs">${rungs}</ol>
        </article>`;
      })
      .join("");
    return `<section>
      <h2 class="h-lg">${esc(group.label)}</h2>
      <p class="muted">${esc(group.intent)}</p>
      <div class="stack">${chains}</div>
    </section>`;
  }).join("");
  return `<header>
      <p class="kicker">Progress</p>
      <h1 class="display">Ladders</h1>
    </header>
    <p class="lede">Each family runs easy to pro. It climbs when two of the last three appearances felt easy, and only after a week on that step. At the top, or when the next weight is more than you own, the load stays put and the protocol moves: more reps, tempo, pause, a bilateral stand-in for unilateral, then rest-pause.</p>
    <div class="groups">${groups}</div>`;
}

function stepper(id, label, value, hint, dec, inc) {
  return `<div class="card pad">
    <label class="kicker" for="${id}">${esc(label)}</label>
    <div class="stepper">
      <button type="button" class="btn secondary square" data-act="${dec}" aria-label="Decrease ${esc(label)}">−</button>
      <input id="${id}" inputmode="numeric" value="${esc(value)}" />
      <button type="button" class="btn secondary square" data-act="${inc}" aria-label="Increase ${esc(label)}">+</button>
    </div>
    <p class="fine">${esc(hint)}</p>
  </div>`;
}

function gearHTML() {
  const ready = ensure(state, state.createdAt || new Date().toISOString());
  const preview = buildMoves(ready, "slot");
  const meta = lineupMeta(ready, "slot");
  const title = ready.active ? "Next session, with this gear" : `${meta.title}, with this gear`;
  return `<header>
      <p class="kicker">What you own</p>
      <h1 class="display">Gear</h1>
    </header>
    <p class="lede">Dumbbells are per hand. The kettlebell is the one bell. A band is assumed. Saved on this phone. Nothing is sent anywhere. A session already underway keeps its plan.</p>
    <div class="stack">
      ${stepper("db", "Dumbbell, kg each hand", ready.gear.dumbbellKg, "Zero means you have no dumbbells. A pair of 5kg is the default.", "db-dec", "db-inc")}
      ${stepper("kb", "Kettlebell, kg", ready.gear.kettlebellKg, "Zero means you have no kettlebell. Default is 8kg, so set the bell you actually have.", "kb-dec", "kb-inc")}
    </div>
    <section class="card pad">
      <h2 class="h-lg">${esc(title)}</h2>
      <ul class="list">${preview
        .map(
          (move) => `<li class="row">
          <p class="muted">${esc(move.groupLabel)}${move.role === "extra" ? " · extra" : ""}</p>
          <p class="name">${esc(move.rungName)} · ${esc(move.loadLine)}</p>
          ${move.notes[0] ? `<p class="note">${esc(move.notes[0])}</p>` : ""}
        </li>`,
        )
        .join("")}</ul>
    </section>
    <section class="block">
      <h2 class="h-lg">What was left out</h2>
      <p class="lede">Hinges, twists, and anything that loads one side of the pelvis. Overhead work is seated against a wall so the low back cannot arch into the press. Bridges stay bilateral and stop in a straight line from shoulder to knee. When a ladder asks for unilateral work, it is swapped for a bilateral one-and-a-half, and the note stays on the card.</p>
    </section>`;
}

function sessionHTML() {
  const active = state.active;
  if (!active) return "";
  const elapsed = active.finishedAt
    ? new Date(active.finishedAt).getTime() - new Date(active.startedAt).getTime()
    : Date.now() - new Date(active.startedAt).getTime();
  const over = active.phase !== "done" && elapsed >= TEN_MIN_MS;
  const header = `<header class="split centerline">
    <button type="button" class="btn ghost" data-act="close">Close</button>
    <p id="clock" class="nums">${esc(formatElapsed(elapsed))}${over ? " · past ten" : ""}</p>
    <p class="kicker">${active.phase === "done" ? "Done" : `${active.cursor + 1} of ${active.moves.length}`}</p>
  </header>`;
  if (active.phase === "done" && active.results) {
    const rows = active.results
      .map(
        (result) => `<li class="row">
        <p class="kicker">${esc(result.groupLabel)} · ${esc(RATING_LABEL[result.rating])}</p>
        <p class="name">${esc(result.family)}</p>
        <p>${esc(result.outcome)}</p>
        <p class="muted">${esc(result.reason)}</p>
      </li>`,
      )
      .join("");
    return `${header}
      <section class="space">
        <h1 class="display">Logged</h1>
        <p class="lede">The lineup moves on. A chain climbs only when two of its last three were easy, with a week already on that step.</p>
        <ul class="card list">${rows}</ul>
        <button type="button" class="btn primary" data-act="dismiss">Back to the week</button>
      </section>`;
  }
  const move = active.moves[active.cursor];
  const protocol = move.counts ? protocolLabel(move.tierIndex) : null;
  const steps =
    move.steps.length === 0
      ? ""
      : `<ol class="steps">${move.steps.map((step) => `<li>${esc(step)}</li>`).join("")}</ol>`;
  const body =
    active.phase === "do"
      ? `<div class="stack">
          <button type="button" class="btn primary" data-act="set-done">Set done</button>
          ${active.cursor > 0 ? `<button type="button" class="btn ghost" data-act="undo">Undo last rating</button>` : ""}
        </div>`
      : `<h2 class="h-lg">How did that feel?</h2>
        <div class="stack">
          <button type="button" class="btn secondary choice" data-act="rate" data-rating="easy"><span>Easy</span><span class="hint">Could have done more</span></button>
          <button type="button" class="btn secondary choice" data-act="rate" data-rating="solid"><span>Solid</span><span class="hint">The last reps were work</span></button>
          <button type="button" class="btn secondary choice" data-act="rate" data-rating="hard"><span>Hard</span><span class="hint">Form broke, or it hurt</span></button>
        </div>`;
  const discard = confirmDiscard
    ? `<div class="card pad">
        <p>Discard this session? Nothing is saved, and the lineup stays put.</p>
        <div class="stack">
          <button type="button" class="btn primary" data-act="discard-no">Keep going</button>
          <button type="button" class="btn secondary" data-act="discard-yes">Discard</button>
        </div>
      </div>`
    : `<button type="button" class="btn ghost" data-act="discard-ask">Discard</button>`;
  return `${header}
    <section class="space rise" data-move="${esc(move.chainId)}-${active.cursor}">
      <p class="kicker">${esc(move.groupLabel)}${move.role === "extra" ? " · extra" : ""}${protocol ? ` · ${esc(protocol)}` : ""}</p>
      <h1 class="display">${esc(move.rungName)}</h1>
      <p class="load">${esc(move.loadLine)}</p>
      <p class="dose">${esc(move.headline)}</p>
      <p class="lede">${esc(move.detail)}</p>
      ${steps}
      ${move.notes.map((note) => `<p class="callout">${esc(note)}</p>`).join("")}
      <ul class="cues">${move.cues.map((cue) => `<li>${esc(cue)}</li>`).join("")}</ul>
      ${body}
      <div class="discard">${discard}</div>
    </section>`;
}

function navHTML() {
  const items = [
    ["today", "Today", iconSun()],
    ["ladders", "Ladders", iconLayers()],
    ["gear", "Gear", iconGear()],
  ];
  return `<nav>
    <ul>
      ${items
        .map(([id, label, icon]) => {
          const on = view === id;
          return `<li><a href="#/${id}" aria-current="${on ? "page" : "false"}">${icon}<span>${label}</span></a></li>`;
        })
        .join("")}
    </ul>
  </nav>`;
}

function iconSun() {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>`;
}
function iconLayers() {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>`;
}
function iconGear() {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3V21.5M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12H21.5M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>`;
}

function render() {
  syncRoute();
  const root = document.getElementById("app");
  const inSession = view === "session";
  const page = inSession ? sessionHTML() : view === "ladders" ? laddersHTML() : view === "gear" ? gearHTML() : todayHTML();
  root.className = inSession ? "shell session" : "shell";
  root.innerHTML = `<div class="page">${page}</div>${inSession ? "" : navHTML()}`;
  stopClock();
  if (inSession && state.active && state.active.phase !== "done") startClock();
  if (focusHeading) {
    focusHeading = false;
    const heading = root.querySelector("h1");
    if (heading) {
      heading.tabIndex = -1;
      heading.focus();
    }
  }
}

function fresh() {
  return ensure(state, new Date().toISOString());
}

function setKg(which, value, max) {
  const next = fresh();
  const n = Number(value);
  const kg = Number.isFinite(n) ? Math.min(max, Math.max(0, Math.round(n))) : 0;
  next.gear = { ...next.gear, [which]: kg };
  persist(ensure(next, new Date().toISOString()));
  render();
}

function onClick(event) {
  const target = event.target.closest("[data-act]");
  if (!target) return;
  const act = target.dataset.act;
  if (act === "start-slot" || act === "start-again") {
    const now = new Date().toISOString();
    const base = fresh();
    if (!base.active) base.active = buildActive(base, act === "start-again" ? "again" : "slot", now);
    confirmDiscard = false;
    persist(base);
    focusHeading = true;
    go("session");
    return;
  }
  if (act === "resume") {
    confirmDiscard = false;
    focusHeading = true;
    go("session");
    return;
  }
  if (act === "close" || act === "dismiss") {
    if (act === "dismiss") persist(dismissSession(fresh()));
    confirmDiscard = false;
    go("today");
    return;
  }
  if (act === "set-done") {
    persist(beginRate(fresh()));
    focusHeading = true;
    render();
    return;
  }
  if (act === "rate") {
    persist(applyRating(fresh(), target.dataset.rating, new Date().toISOString()));
    confirmDiscard = false;
    focusHeading = true;
    render();
    return;
  }
  if (act === "undo") {
    persist(undoRating(fresh()));
    confirmDiscard = false;
    render();
    return;
  }
  if (act === "discard-ask") {
    confirmDiscard = true;
    render();
    return;
  }
  if (act === "discard-no") {
    confirmDiscard = false;
    render();
    return;
  }
  if (act === "discard-yes") {
    const base = fresh();
    if (!base.active?.committed) base.active = null;
    confirmDiscard = false;
    persist(base);
    go("today");
    return;
  }
  if (act === "db-dec") setKg("dumbbellKg", state.gear.dumbbellKg - 1, 40);
  if (act === "db-inc") setKg("dumbbellKg", state.gear.dumbbellKg + 1, 40);
  if (act === "kb-dec") setKg("kettlebellKg", state.gear.kettlebellKg - 1, 48);
  if (act === "kb-inc") setKg("kettlebellKg", state.gear.kettlebellKg + 1, 48);
}

function onChange(event) {
  const el = event.target;
  if (el.id === "db") setKg("dumbbellKg", el.value, 40);
  if (el.id === "kb") setKg("kettlebellKg", el.value, 48);
}

function boot() {
  load();
  if (!location.hash) history.replaceState(null, "", "#/today");
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("change", onChange);
  window.addEventListener("hashchange", render);
  render();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW registration failed", err));
    });
  }
}

boot();

</script>
</body>
</html>
